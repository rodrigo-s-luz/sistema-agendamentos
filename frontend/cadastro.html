<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/autenticacao.css" />
  </head>
  <body>
    <header class="marca">
      <img src="./images/logo-hora-certa.png.png" alt="Hora Certa" />
    </header>
    <main class="cartao-autenticacao">
      <h1 class="titulo-autenticacao">Crie sua conta</h1>
      <p class="subtitulo">Cadastre-se para agendar seu horário.</p>

      <form id="form-cadastro">
        <div class="campo">
          <label for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            autocomplete="name"
            required
          />
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            autocomplete="tel"
            required
          />
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" autocomplete="" required />
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="campo">
          <label for="confirmar-senha">Confirmar senha</label>
          <input
            type="password"
            id="confirmar-senha"
            name="confirmar-senha"
            autocomplete="new-password"
            required
          />
        </div>

        <button class="botao-primario" type="button">Criar minha conta</button>
      </form>

      <p class="link-cadastro">
        Já tem uma conta? <a href="index.html">Entrar</a>
      </p>
    </main>

    <footer>
      <p>Sistema de Agendamentos</p>
      <p>RL Soluções Digitais</p>
    </footer>
  </body>
</html>
